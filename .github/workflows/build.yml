name: Build the app

on:
  push:
    paths:
      - "p*.js"
      - "p*.html"
      - "core_*.js"
      - "rules.min.json"
      - "libheif-bundle.js"
      - "sw.js.template"
      - "vapid_public.txt"
      - "src/**"
      - "build.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app.html and sw.js
        run: python3 build.py

      - name: Check it is a whole page
        run: |
          test -s app.html
          test -s sw.js
          grep -q "</html>" app.html
          grep -q 'id="heifsrc"' app.html
          echo "app.html is $(wc -c < app.html) bytes"

      - name: Check the two files are the same build
        run: |
          app=$(grep -o 'BUILD_ID = "[0-9a-f]\{10\}"' app.html | grep -o '[0-9a-f]\{10\}')
          sw=$(head -1 sw.js | grep -o 'build [0-9a-f]\{10\}' | cut -d' ' -f2)
          echo "app.html: $app"
          echo "sw.js:    $sw"
          test -n "$app" || { echo "app.html carries no build id"; exit 1; }
          test "$app" = "$sw" || { echo "MISMATCH — refusing to publish"; exit 1; }

      - name: Commit them
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js
          git diff --staged --quiet || git commit -m "Build app.html and sw.js"
          git push
